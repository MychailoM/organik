<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organick</title>
    <link rel="shortcut icon" href="./icons/logo.svg" type="image/x-icon">

    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Yellowtail&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="header__logo">
                <svg class="header__logo-icon">
                    <use href="./icons/logo.svg"></use>
                </svg>
                Organick
            </a>
            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">Home</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">About</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">Pages <svg width="8" height="5" viewBox="0 0 8 5"
                                fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M0.75 0.75L3.75 3.75L6.75 0.75" stroke="#274C5B" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg></a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">Shop</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">Projects</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">News</a>
                    </li>
                </ul>
            </nav>
            <div class="header__buttons-wrap">
                <div class="header__cart-btn-wrap">
                    <button type="button" class="header__cart-btn">
                        <svg class="header__cart-btn-icon">
                            <use href="./icons/cart.svg"></use>
                        </svg>
                    </button>
                    <h3 class="header__cart-btn-text">Cart (0)</h3>
                </div>

                <button class="header__mobile-menu">
                    <span class="header__mobile-menu-line"></span>
                    <span class="header__mobile-menu-line"></span>
                    <span class="header__mobile-menu-line"></span>
                </button>
            </div>

        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="container">
                <h3 class="hero__subtitle">100% Natural Food</h3>
                <h1 class="hero__title">Choose the best <br>
                    healthier way <br>
                    of life</h1>
                    <button class="hero__btn">Explore Now</button>
            </div>
        </section>
    </main>
    <footer class="footer"></footer>

    <script type="module" src="./scripts/script.js"></script>
